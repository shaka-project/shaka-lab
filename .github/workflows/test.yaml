name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    # Manual triggering.

permissions:
  contents: read

jobs:
  access-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shaka-lab-access-portal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Ubuntu 26.04, the oldest release this package supports, ships
          # Node 22.
          node-version: 22
          cache: npm
          cache-dependency-path: shaka-lab-access-portal/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
