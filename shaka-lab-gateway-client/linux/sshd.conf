# sshd config for Shaka Lab Gateway clients.

# Let lab users log in with a Kerberos ticket from the gateway instead of a
# password.  This uses the host keys in /etc/krb5.keytab, which are created
# when the package joins this machine to the domain.
GSSAPIAuthentication yes

# Accept a ticket for any host principal in /etc/krb5.keytab, instead of only
# the one built from this machine's own host name.  On a typical install,
# /etc/hosts maps the host name to 127.0.1.1 without the lab.shaka domain, so
# sshd would expect host/NAME@LAB.SHAKA and reject tickets for the full name.
# The keytab only holds this machine's keys, so this accepts nothing more.
GSSAPIStrictAcceptorCheck no
