# ssh client config for Shaka Lab Gateway clients on macOS.

Host *.lab.shaka shaka-* gateway
  # Log in to lab machines with a Kerberos ticket from the gateway instead of
  # a password.  Get a ticket once with kinit.
  GSSAPIAuthentication yes

  # Pass the ticket along to the machine you log in to, so that SSH from there
  # to another lab machine also works without kinit.
  GSSAPIDelegateCredentials yes
