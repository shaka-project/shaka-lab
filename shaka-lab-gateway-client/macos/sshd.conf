# sshd config for Shaka Lab Gateway clients on macOS.

# Let lab users log in with a Kerberos ticket from the gateway instead of a
# password.  This uses the host keys in /etc/krb5.keytab, which macOS creates
# when it binds this machine to the domain.
GSSAPIAuthentication yes

# Accept a ticket for any host principal in /etc/krb5.keytab, instead of only
# the one built from this machine's own host name.  The host name on macOS
# comes from DHCP or the sharing name, and may not be the full lab.shaka name
# that the keys are for.  The keytab only holds this machine's keys, so this
# accepts nothing more.
GSSAPIStrictAcceptorCheck no
