# Config file for needrestart, which suppresses prompting and restarts all
# affected services.
$nrconf{restart} = 'a';

# Setting a restart mode turns off needrestart's Ubuntu mode, so needrestart
# uses its Debconf UI.  By default, that UI shows a full-screen dialog for a
# pending kernel or CPU microcode upgrade, and waits for someone to dismiss it.
# A value of -1 prints a one-line notice instead.  shaka-lab-update-os already
# says when a restart is needed.
$nrconf{kernelhints} = -1;
$nrconf{ucodehints} = -1;
