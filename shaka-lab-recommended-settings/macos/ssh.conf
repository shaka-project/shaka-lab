# ssh client config for Shaka Lab machines on macOS.
#
# install.sh only installs this if the local ssh client understands
# WarnWeakCrypto.  Older clients refuse to run if any config file mentions it,
# even in a Host block that doesn't match.

Host *.lab.shaka shaka-* gateway
  # Lab machines running Windows don't offer a post-quantum key exchange yet,
  # and newer ssh clients warn about that on every connection.  Turn off only
  # that warning.
  WarnWeakCrypto no-pq-kex
