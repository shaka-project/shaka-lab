# Configure log rotation for newsyslog.
# 10MB files (10240), compress with gzip (flag Z).
# The service log path is a pattern (flag G), which newsyslog would otherwise
# look for as a literal file name.
# The service logs belong to the GUI user, which the package install puts in
# place of "$GUI_USER".  The proxy runs as root, under launchd, which doesn't
# reopen its log, so don't signal anything for it (flag N).
# path                                           owner:group mode count size  when flags pid_file
/opt/shaka-lab-node/logs/*.log                   $GUI_USER:  644  10    10240 *    GZ    /opt/shaka-lab-node/work/shaka-lab-node.pid
/var/log/shaka-lab-node/local-network-proxy.log  :           644  10    10240 *    N
