# ssh client config for Shaka Lab Gateway.

Host *.lab.shaka shaka-* gateway
    # Forward the user's Kerberos ticket to lab hosts, so they can ssh onward
    # from there without running kinit again.  Lab hosts only receive it if
    # they are in the domain and accept the user's Kerberos login.  This
    # matches the config that shaka-lab-gateway-client installs on lab clients.
    GSSAPIDelegateCredentials yes
