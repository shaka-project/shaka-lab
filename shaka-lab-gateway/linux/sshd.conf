# sshd config for Shaka Lab Gateway.

# Let lab users log in with a Kerberos ticket instead of a password.  This uses
# the gateway's host keys in /etc/krb5.keytab, which the package exports from
# Active Directory.
GSSAPIAuthentication yes

# Accept a ticket for any host principal in /etc/krb5.keytab, instead of only
# the one built from this machine's own host name.  The keytab only holds this
# machine's keys, so this accepts nothing more.
GSSAPIStrictAcceptorCheck no
